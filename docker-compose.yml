services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: beresbirag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  beresbirag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beresbirag-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: bsb_rag
    volumes:
      - ./bsb_usj.zip:/app/bsb_usj.zip:ro
      - ./bsb_book_outlines.pdf:/app/bsb_book_outlines.pdf:ro
      - ./bsb_topical_index.xlsx:/app/bsb_topical_index.xlsx:ro
      - ./bsb_concordance.xlsx:/app/bsb_concordance.xlsx:ro

volumes:
  qdrant_data:
