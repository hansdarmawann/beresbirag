name: CI — beresbirag

on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ALLOWED_AUTHORS: |
    Hans Darmawan <work.hansdarmawan001@gmail.com>
    dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>

jobs:
  git-hygiene-and-test:
    name: Conda (beresbirag) Lint, Test & Git Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify single-contributor Git authorship & no AI trailers
        run: |
          echo "Checking recent commit authors and commit bodies..."
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-n 5"
          fi

          echo "Inspecting commits with range: $RANGE"
          if [ "$RANGE" = "-n 5" ]; then
            AUTHORS=$(git log -n 5 --no-merges --format="%an <%ae>")
            BODIES=$(git log -n 5 --no-merges --format="%b")
          else
            AUTHORS=$(git log --no-merges --format="%an <%ae>" "$RANGE" 2>/dev/null || git log -n 5 --no-merges --format="%an <%ae>")
            BODIES=$(git log --no-merges --format="%b" "$RANGE" 2>/dev/null || git log -n 5 --no-merges --format="%b")
          fi

          while IFS= read -r author; do
            [ -z "$author" ] && continue
            if ! echo "$ALLOWED_AUTHORS" | grep -Fxq "$author"; then
              echo "ERROR: Unauthorized commit author detected: $author"
              exit 1
            fi
          done <<< "$AUTHORS"

          CO_AUTHORS=$(echo "$BODIES" | grep -Ei "Co-authored-by:|Generated with" || true)
          if [ -n "$CO_AUTHORS" ]; then
            echo "ERROR: Forbidden Co-authored-by or AI attribution trailer found:"
            echo "$CO_AUTHORS"
            exit 1
          fi

      - name: Set up Miniconda (beresbirag environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: beresbirag
          environment-file: environment.yml
          python-version: "3.11"
          use-only-tar-bz2: false

      - name: Run Ruff Linter
        shell: bash -el {0}
        run: |
          ruff check ./src ./scripts ./tests

      - name: Run Ruff Formatter Check
        shell: bash -el {0}
        run: |
          ruff format --check ./src ./scripts ./tests

      - name: Run Mypy Type Checker
        shell: bash -el {0}
        run: |
          mypy ./src

      - name: Run Pytest Suite
        shell: bash -el {0}
        env:
          QDRANT_MODE: memory
          EMBEDDING_PROVIDER: fastembed
        run: |
          pytest -v

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: git-hygiene-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: beresbirag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
