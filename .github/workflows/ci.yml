name: CI — beresbirag

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  git-hygiene-and-test:
    name: Conda (beresbirag) Lint, Test & Git Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Verify single-contributor Git authorship & no AI trailers
        run: |
          echo "Checking recent commit authors and commit bodies..."
          BAD_AUTHORS=$(git log -n 5 --format="%an <%ae>" | grep -v "^Hans Darmawan <work.hansdarmawan001@gmail.com>$" || true)
          if [ -n "$BAD_AUTHORS" ]; then
            echo "ERROR: Unauthorized commit author detected:"
            echo "$BAD_AUTHORS"
            exit 1
          fi
          CO_AUTHORS=$(git log -n 5 --format="%b" | grep -Ei "Co-authored-by:|Generated with" || true)
          if [ -n "$CO_AUTHORS" ]; then
            echo "ERROR: Forbidden Co-authored-by or AI attribution trailer found:"
            echo "$CO_AUTHORS"
            exit 1
          fi

      - name: Set up Miniconda (beresbirag environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: beresbirag
          environment-file: environment.yml
          python-version: "3.11"
          use-only-tar-bz2: false

      - name: Run Ruff Linter
        shell: bash -el {0}
        run: |
          ruff check ./src ./tests

      - name: Run Pytest Suite
        shell: bash -el {0}
        env:
          QDRANT_MODE: memory
          EMBEDDING_PROVIDER: fastembed
        run: |
          pytest -v

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: git-hygiene-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: beresbirag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
