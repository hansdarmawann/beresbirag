[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beresbirag"
version = "0.2.0"
description = "Berean Standard Bible (BSB) Hybrid RAG System powered by LangChain and Qdrant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Hans Darmawan", email = "work.hansdarmawan001@gmail.com" }
]
dependencies = [
    "langchain-core>=1.7,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-openai>=1.7,<2",
    "langchain-anthropic>=1.7,<2",
    "qdrant-client>=1.20,<2",
    "fastembed>=0.9,<0.10",
    "flashrank>=0.2.10,<0.3",
    "pymupdf>=2.0,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "typer>=0.27,<1",
    "rich>=15.0,<16",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
    "psutil>=7.2,<8",
]

[project.optional-dependencies]
offline = ["langchain-ollama>=1.1,<2"]
ui = ["streamlit>=1.66,<2"]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
beresbirag = "beresbirag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
